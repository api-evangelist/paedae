aid: paedae
name: Paedae
description: >-
  Paedae is the company behind the Gimbal proximity and location platform (a 500
  Global portfolio company; paedae.com now redirects to gimbal.com, operated
  under Infillion). Gimbal provides beacons, geofencing, and a proximity SDK for
  iOS and Android, plus a Gimbal Manager REST API to manage applications,
  places, beacons, beacon configurations, and location-triggered communications.
  Beacon sighting events (Arrived/Departed/Sighted) are delivered via HTTP
  callbacks. This profile was enriched from the live Gimbal developer surface at
  docs.gimbal.com and manager.gimbal.com.
