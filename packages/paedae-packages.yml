notes: >-
  Gimbal's first-party client surface is mobile SDKs, not REST clients — there
  is no published client library for the Gimbal Manager REST API in any
  registry, in any language. The live lines are iOS (CocoaPods + SwiftPM,
  2026-05) and React Native (npm, 2026-06); Android has not shipped since
  2024-07 and the Android docs point at a version eight releases stale. The
  latest builds are also distributed as zips from the SDK Downloads section of
  Gimbal Manager (manager.gimbal.com), which requires a login.
